[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-ops-copilot"
version = "0.1.0"
description = "Realtime multimodal incident collaboration and approval workbench"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2.8", "python-multipart>=0.0.9", "pillow>=10.4"]
authors = [{name = "SunZhengjun"}]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ops_copilot = ["web/*"]

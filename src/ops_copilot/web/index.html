<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multimodal Ops Copilot</title><link rel="stylesheet" href="/assets/style.css"></head><body>
<header><span>MULTIMODAL INCIDENT ROOM</span><h1>See it. Hear it. Trace it.</h1><p>Combine logs, screenshots, voice and operator judgment into one auditable incident brief.</p></header>
<main><section class="panel create"><input id="title" value="Synthetic network incident"><button id="create">Create incident room</button><b id="status">Offline provider</b></section>
<section class="panel ingest"><h2>Evidence</h2><label class="drop">Drop or select logs, screenshots and audio<input id="files" type="file" multiple accept=".log,.txt,.json,.png,.jpg,.jpeg,.wav,.webm"></label><button id="record">● Record voice</button><div id="artifacts"></div></section>
<section class="panel"><h2>Operator request</h2><textarea id="message">Analyze the evidence, build a timeline, and propose a safe remediation.</textarea><button id="analyze">Analyze</button><button class="secondary" id="interrupt">Interrupt</button><div id="events"></div></section>
<section class="panel output"><h2>Incident brief</h2><div id="approval"></div><pre id="result">Create an incident room to begin.</pre></section></main><script src="/assets/app.js"></script></body></html>
